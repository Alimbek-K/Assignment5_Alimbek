
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kanban Task Board</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/task2.js" defer></script>
</head>

<body class="kanban-page">

    <main class="kanban-container">

        <header class="kanban-header">
            <h1>Kanban Task Board</h1>
            <p>Manage tasks and track your progress.</p>
        </header>

        <section class="kanban-controls">
            <label for="searchTask">Search tasks</label>
            <input
                type="search"
                id="searchTask"
                placeholder="Search by task name">

            <label for="tagFilter">Filter by tag</label>
            <select id="tagFilter">
                <option value="all">All tags</option>
                <option value="study">Study</option>
                <option value="work">Work</option>
                <option value="personal">Personal</option>
            </select>

            <label for="sortPriority">Sort by priority</label>
            <select id="sortPriority">
                <option value="default">Default order</option>
                <option value="high">High priority first</option>
                <option value="low">Low priority first</option>
            </select>
        </section>

        <section class="kanban-progress">
            <h2>Overall Progress</h2>
            <progress id="progressBar" value="0" max="100"></progress>
            <p id="progressText">0% completed</p>
        </section>

        <p id="boardMessage" role="status" aria-live="polite"></p>

        <section class="kanban-board" id="kanbanBoard">
            <div class="kanban-column">
                <h2>To Do</h2>
                <div id="todoTasks" class="task-list"></div>
            </div>

            <div class="kanban-column">
                <h2>In Progress</h2>
                <div id="progressTasks" class="task-list"></div>
            </div>

            <div class="kanban-column">
                <h2>Done</h2>
                <div id="doneTasks" class="task-list"></div>
            </div>
        </section>

    </main>

</body>
</html>
